<!DOCTYPE html>
<html>
<head>
    <title>Contact Manager</title>
    <script src="app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="">

<div class="container mt-5">
    <h2 class="text-center mb-4">Contact Manager</h2>

    <div id="message"></div>

    <div class="card p-4 mb-4 shadow-sm">
        <div class="row g-3">

            <div class="col-md-2">
                <input type="number" id="contactId" class="form-control" placeholder="ID">
            </div>

            <div class="col-md-3">
                <input type="text" id="contactName" class="form-control" placeholder="Name">
            </div>

            <div class="col-md-3">
                <input type="email" id="contactEmail" class="form-control" placeholder="Email">
            </div>

            <div class="col-md-2">
                <input type="text" id="contactPhone" class="form-control" placeholder="Phone">
            </div>

            <div class="col-md-2">
                <button id="submitBtn" onclick="handleSubmit()" class="btn btn-primary w-100">
                    Add Contact
                </button>
            </div>

        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-bordered table-striped">
                <thead class="">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th width="150">Actions</th>
                    </tr>
                </thead>
                <tbody id="contactTableBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
